response_schemas:
  crt:
    description: >
      Schema for short-answer survey items.
      Each response should include survey and item position, with the
      participant's final answer as a short string.
    instruction: >
      Return exactly ONE valid JSON value.
      - If I asked for ONE item: return ONE JSON object matching the item schema.
      - If I asked for MULTIPLE items: return ONE JSON array of JSON objects, one per item, each matching the item schema.
      No extra keys. No explanations. No markdown.
    json_schema:
      oneOf:
        - type: object
          properties:
            survey:
              type: string
              description: "Survey label as shown in prompt (e.g. 'Survey 3')."
            item_number:
              type: integer
              minimum: 1
              description: "1-indexed position within that survey section."
            answer:
              type: string
              description: "The final answer (number or word) as a short string."
          required: ["survey", "item_number", "answer"]
          additionalProperties: false
        - type: array
          items:
            type: object
            properties:
              survey:
                type: string
                description: "Survey label as shown in prompt (e.g. 'Survey 3')."
              item_number:
                type: integer
                minimum: 1
                description: "1-indexed position within that survey section."
              answer:
                type: string
                description: "The final answer (number or word) as a short string."
            required: ["survey", "item_number", "answer"]
            additionalProperties: false
          minItems: 1
  likert:
    description: >
      Schema for Likert-style survey items.
      Each response should include survey and item position, with a
      Likert integer response in the specified range.
    instruction: >
      Return exactly ONE valid JSON value.
      - If I asked for ONE item: return ONE JSON object matching the item schema.
      - If I asked for MULTIPLE items: return ONE JSON array of JSON objects, one per item, each matching the item schema.
      No extra keys. No explanations. No markdown.
    json_schema:
      oneOf:
        - type: object
          properties:
            survey:
              type: string
              description: "Survey label as shown in prompt (e.g. 'Survey 1')."
            item_number:
              type: integer
              minimum: 1
              description: "1-indexed position within that survey section."
            response:
              type: integer
              minimum: 1
              maximum: 5
              description: "Chosen Likert option as an integer (1-5)."
          required: ["survey", "item_number", "response"]
          additionalProperties: false
        - type: array
          items:
            type: object
            properties:
              survey:
                type: string
                description: "Survey label as shown in prompt (e.g. 'Survey 1')."
              item_number:
                type: integer
                minimum: 1
                description: "1-indexed position within that survey section."
              response:
                type: integer
                minimum: 1
                maximum: 5
                description: "Chosen Likert option as an integer (1-5)."
            required: ["survey", "item_number", "response"]
            additionalProperties: false
          minItems: 1
  brt:
    description: >
      Schema for free-text survey items.
      Each response should include survey and item position, and a free-text
      answer in plain language.
    instruction: >
      Return exactly ONE valid JSON value.
      - If I asked for ONE item: return ONE JSON object matching the item schema.
      - If I asked for MULTIPLE items: return ONE JSON array of JSON objects, one per item, each matching the item schema.
      No extra keys. No explanations. No markdown.
    json_schema:
      oneOf:
        - type: object
          properties:
            survey:
              type: string
              description: "Survey label as shown in prompt (e.g. 'Survey 4')."
            item_number:
              type: integer
              minimum: 1
              description: "1-indexed position within that survey section."
            response_text:
              type: string
              description: "The full free-text answer in plain English."
          required: ["survey", "item_number", "response_text"]
          additionalProperties: false
        - type: array
          items:
            type: object
            properties:
              survey:
                type: string
                description: "Survey label as shown in prompt (e.g. 'Survey 4')."
              item_number:
                type: integer
                minimum: 1
                description: "1-indexed position within that survey section."
              response_text:
                type: string
                description: "The full free-text answer in plain English."
            required: ["survey", "item_number", "response_text"]
            additionalProperties: false
          minItems: 1
