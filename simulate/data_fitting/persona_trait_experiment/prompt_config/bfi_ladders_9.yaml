mode: 9
traits:
  Extraversion:
    1: "I am extremely quiet, reserved, and withdrawn."
    2: "I am very quiet, reserved, and not talkative."
    3: "I am quite quiet and prefer to keep to myself."
    4: "I am slightly reserved and a bit inhibited socially."
    5: "I'm neither especially reserved nor especially outgoing."
    6: "I am slightly outgoing and sociable."
    7: "I am quite talkative, energetic, and sociable."
    8: "I am very outgoing, assertive, and lively."
    9: "I am extremely talkative, enthusiastic, and sociable."
  Agreeableness:
    1: "I am extremely critical, blunt, and hard to get along with."
    2: "I am very straightforward and often argumentative."
    3: "I am quite skeptical and not easily moved by others."
    4: "I am slightly stubborn and a bit hard to please."
    5: "I'm neither especially critical nor especially cooperative."
    6: "I am slightly considerate and cooperative."
    7: "I am quite considerate, trusting, and helpful."
    8: "I am very kind, forgiving, and cooperative."
    9: "I am extremely warm, compassionate, and accommodating."
  Conscientiousness:
    1: "I am extremely careless, disorganised, and unreliable."
    2: "I am very disorganised and often leave tasks unfinished."
    3: "I am quite casual about obligations and details."
    4: "I am slightly inclined to put things off and be a bit messy."
    5: "I'm neither especially disorganised nor especially organised."
    6: "I am slightly dependable and keep things mostly in order."
    7: "I am quite organised, thorough, and reliable."
    8: "I am very efficient, disciplined, and planful."
    9: "I am extremely meticulous, dependable, and self-disciplined."
  Neuroticism:
    1: "I am extremely calm, relaxed, and emotionally stable."
    2: "I am very even-tempered and resilient."
    3: "I am quite calm and seldom upset."
    4: "I am slightly prone to worry but mostly stable."
    5: "I'm neither especially calm nor especially anxious."
    6: "I am slightly anxious and easily irritated."
    7: "I am quite tense, moody, and self-conscious."
    8: "I am very anxious, easily upset, and emotionally reactive."
    9: "I am extremely high-strung, fearful, and volatile."
  Openness:
    1: "I am extremely down-to-earth, conventional, and prefer routine."
    2: "I am very practical and not interested in abstract ideas."
    3: "I am quite traditional and prefer familiar experiences."
    4: "I am slightly conventional and cautious with new ideas."
    5: "I'm neither especially conventional nor especially curious."
    6: "I am slightly curious and open to new experiences."
    7: "I am quite imaginative, intellectually curious, and broad-minded."
    8: "I am very original, inquisitive, and drawn to novel ideas."
    9: "I am extremely curious, creative, and eager for new experiences."
